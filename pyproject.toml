[project]
name = "wayfinder-rag"
version = "0.1.0"
description = "A production-oriented RAG and agentic retrieval system for open-source software knowledge."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wayfinder"
